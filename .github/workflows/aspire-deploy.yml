name: Aspire Deploy CI/CD

on:
  push:
    branches:
      - live

permissions:
    id-token: write # This is required for requesting the JWT
    contents: read  # This is required for actions/checkout

jobs:
  aspire_deploy:
    runs-on: ubuntu-latest
    name: Deploy with Aspire
    permissions:
      id-token: write
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: ./src/bingo-board/package-lock.json
      
      - name: Install Aspire CLI
        run: curl -sSL https://aspire.dev/install.sh | bash
      
      - name: Add Aspire CLI to PATH
        run: echo "$HOME/.aspire/bin" >> $GITHUB_PATH

      - name: Validate release
        run: |
          dotnet test --project ./src/BingoBoard.Admin.Tests/BingoBoard.Admin.Tests.csproj --configuration Release
          npm ci --prefix ./src/bingo-board
          npm audit --prefix ./src/bingo-board --audit-level=high
          npm run build --prefix ./src/bingo-board
      
      - name: Set version information
        run: |
          # Extract Aspire version from apphost.cs
          ASPIRE_FULL_VERSION=$(grep -o '#:sdk Aspire.AppHost.Sdk@.*' ./src/apphost.cs | cut -d'@' -f2)
          # Get semantic version with preview tag (e.g., 13.0.0-preview.1)
          ASPIRE_VERSION=$(echo $ASPIRE_FULL_VERSION | grep -oP '^\d+\.\d+\.\d+(-preview\.\d+)?')
          
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "DOTNET_VERSION=$(dotnet --version)" >> $GITHUB_ENV
          echo "ASPIRE_VERSION=$ASPIRE_VERSION" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date -u +"%a, %d %b %Y %H:%M:%S GMT")" >> $GITHUB_ENV
          # For Vue app (needs VITE_ prefix)
          echo "VITE_COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "VITE_DOTNET_VERSION=$(dotnet --version)" >> $GITHUB_ENV
          echo "VITE_ASPIRE_VERSION=$ASPIRE_VERSION" >> $GITHUB_ENV
      
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify personal Bingo deployment target
        shell: bash
        env:
          TARGET_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TARGET_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          TARGET_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          TARGET_LOCATION: ${{ secrets.AZURE_LOCATION || 'eastus2' }}
          TARGET_CACHE_PASSWORD: ${{ secrets.CACHE_PASSWORD }}
        run: |
          set -euo pipefail
          expected_subscription='2113f0e9-9b41-4726-82ee-04b39336df1a'
          expected_tenant='bae18cc5-6d78-4894-b578-60f67cca2d5e'
          if [[ "$TARGET_SUBSCRIPTION" != "$expected_subscription" ||
                "$TARGET_TENANT" != "$expected_tenant" ||
                "$TARGET_RESOURCE_GROUP" != 'rg-bingo-aca-1' ||
                "$TARGET_LOCATION" != 'eastus2' ||
                "$(az account show --query id -o tsv)" != "$expected_subscription" ||
                "$(az account show --query tenantId -o tsv)" != "$expected_tenant" ]]; then
            echo '::error::Deployment target does not match the approved personal Bingo environment.'
            exit 1
          fi
          existing_cache_password="$(az containerapp secret list \
            --subscription "$expected_subscription" \
            --resource-group "$TARGET_RESOURCE_GROUP" \
            --name cache --show-values \
            --query "[?name=='redis-password'].value | [0]" -o tsv)"
          if [[ -z "$existing_cache_password" ||
                "$existing_cache_password" != "$TARGET_CACHE_PASSWORD" ]]; then
            echo '::error::Deployment would change the existing Bingo cache credential.'
            exit 1
          fi
          unset existing_cache_password
      
      - name: Deploy with Aspire
        run: aspire deploy --apphost ./src/apphost.cs --environment Production --non-interactive
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          DOTNET_NOLOGO: true
          DOTNET_GENERATE_ASPNET_CERTIFICATE: false
          DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
          DOTNET_MULTILEVEL_LOOKUP: 0
          DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
          Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          Azure__Location: ${{ secrets.AZURE_LOCATION || 'eastus2' }}
          Azure__PostgresLocation: ${{ secrets.AZURE_POSTGRES_LOCATION || secrets.AZURE_LOCATION || 'eastus2' }}
          Azure__ResourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          Parameters__cache_password: ${{ secrets.CACHE_PASSWORD }}
