<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0f0d1d">
    <title>AspiriFridays Bingo</title>
    <link rel="icon" type="image/png" href="/assets/aspire-logo-256.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('aspirifridays-theme') === 'light' ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f6f4fb' : '#0f0d1d'
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
</body>
</html>
